name: 1 - Create signing key (run once)

on: workflow_dispatch

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - name: Check the password secret exists
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_PASSWORD" ]; then
            echo "Add a repository secret named KEY_PASSWORD first (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Create the key
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair -keystore chasex.keystore -alias chasex -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=Chase X Records, O=Chase X Records, C=UG"
          echo "### Your SHA-256 fingerprint" >> "$GITHUB_STEP_SUMMARY"
          echo "Put this in the ANDROID_SHA256 setting of your server:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          keytool -list -v -keystore chasex.keystore -alias chasex -storepass "$KEY_PASSWORD" | grep "SHA256:" | sed 's/.*SHA256: //' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chasex-keystore
          path: chasex.keystore
          retention-days: 1
