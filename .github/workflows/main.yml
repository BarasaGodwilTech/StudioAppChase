name: Build Android app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check settings
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Add a repository variable named SITE_URL, for example https://your-app.onrender.com"
            exit 1
          fi
          sed -i "s#__SITE_URL__#${SITE_URL%/}#" android/app/src/main/res/values/strings.xml

      - name: Prepare signing key
        id: key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/chasex.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/chasex.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_BASE64 secret found. Building a test (debug) app instead."
          fi

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          APP_ID: ${{ vars.APP_ID }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            gradle -p android assembleRelease bundleRelease
          else
            gradle -p android assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: chase-x-app
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/release/*.aab
