name: Keep server awake

# Render's free plan puts the site to sleep after 15 minutes without visitors.
# This pings it every 10 minutes so it stays awake and the app opens instantly.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "Add the SITE_URL repository variable"; exit 1; fi
          curl -fsS --max-time 90 --retry 3 --retry-delay 10 "${SITE_URL%/}/healthz"
