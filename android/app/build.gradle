plugins {
    id 'com.android.application'
}

// These come from the GitHub Actions settings. Defaults only matter for local builds.
def siteUrl   = (System.getenv('SITE_URL') ?: 'https://example.com').replaceAll('/+$', '')
def keystore  = System.getenv('KEYSTORE_FILE')
def appId     = System.getenv('APP_ID') ?: 'com.chasexrecords.app'
def vCode     = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
def vName     = System.getenv('VERSION_NAME') ?: '1.0'

android {
    namespace 'com.chasexrecords.app'
    compileSdk 35

    defaultConfig {
        applicationId appId
        minSdk 21
        targetSdk 35
        versionCode vCode
        versionName vName
        buildConfigField 'String', 'SITE_URL', "\"${siteUrl}\""
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('KEY_PASSWORD')
                keyAlias 'chasex'
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystore) { signingConfig signingConfigs.release }
        }
    }

    lint { checkReleaseBuilds false }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core:1.13.1'
}
